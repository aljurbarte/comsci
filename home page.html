
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: url("background.jpg") center center / cover no-repeat fixed;
        }

        nav {
            background: #667eea;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: rgb(14, 5, 5);
            text-decoration: none;
            margin: 20px;
            font-size: 17px;
            display: inline-block;
        }

        nav a:hover {
            color: white;
        }

        .logout-nav {
            background-color: red;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .logout-nav:hover {
            background-color: rgb(218, 209, 209);
            color: black;
        }

        .content {
            text-align: center;
            padding: 100px 20px;
        }

        @media (max-width: 600px) {
            nav a {
                margin: 8px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
