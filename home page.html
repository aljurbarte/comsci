
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Background Color */
        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #020617,
                #0f172a,
                #1e40af,
                #0891b2
            );
            background-attachment: fixed;
            background-size: cover;
        }

        /* Navigation Bar */
        nav {
            background: rgba(2, 6, 23, 0.55);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.5);
        }

        /* Navigation Links */
        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 17px;
            display: inline-block;
            transition: 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* Logout Button */
        .logout-nav {
            background-color: #ef4444;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .logout-nav:hover {
            background-color: #b91c1c;
            color: white;
        }

        /* Main Content */
        .content {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .content p {
            font-size: 18px;
            color: #cbd5e1;
            line-height: 1.8;
            max-width: 600px;
        }

        /* Shop Button */
        .shop-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 30px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }

        .shop-btn:hover {
            background: #0369a1;
            transform: translateY(-3px);
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            nav {
                padding: 12px 5px;
            }

            nav a {
                margin: 8px;
                font-size: 14px;
            }

            .content h1 {
                font-size: 32px;
            }

            .content p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="home page.html">Home</a>
        <a href="product .html">Product</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
        <a href="index.html" class="logout-nav">Log Out</a>
    </nav>

    <!-- Main Content -->
    <div class="content">
        <h1>WELCOME TO TECH STORE</h1>

        <p>
            Discover the latest smartphones at your fingertips.
            Find quality cellphone products that match your needs
            and enjoy a convenient shopping experience.
        </p>

        <a href="product .html" class="shop-btn">Explore Products</a>
    </div>

</body>
</html>
