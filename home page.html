
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Background Image */
        body {
            min-height: 100vh;
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Navigation Bar */
        nav {
            background: transparent;
            padding: 20px;
            text-align: center;
        }

        /* Navigation Links */
        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 17px;
            display: inline-block;
            text-shadow: 1px 1px 4px black;
            transition: 0.3s;
        }

        /* Hover Effect */
        nav a:hover {
            color: yellow;
        }

        /* Logout Button */
        .logout-nav {
            background-color: red;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-shadow: none;
        }

        .logout-nav:hover {
            background-color: darkred;
            color: white;
        }

        /* Main Content */
        .content {
            text-align: center;
            padding: 100px 20px;
            color: white;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            nav {
                padding: 15px 5px;
            }

            nav a {
                margin: 8px;
                font-size: 15px;
            }

            .content {
                padding: 60px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="home page.html">Home</a>
        <a href="product .html">Product</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
        <a href="index.html" class="logout-nav">Log Out</a>
    </nav>

    <!-- Main Content -->
    <div class="content">
    </div>

</body>
</html>
