
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | Tech Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e3a5f, #2563eb);
    color: #ffffff;
}

/* Navigation Bar */
nav {
    background: #111827;
    padding: 20px;
    text-align: center;
    border-bottom: 2px solid #38bdf8;
}

nav a {
    display: inline-block;
    color: #e2e8f0;
    text-decoration: none;
    margin: 5px 15px;
    padding: 10px 15px;
    border-radius: 6px;
    transition: 0.3s;
}

nav a:hover {
    background: #2563eb;
    color: white;
}

/* Logout Button */
.logout-nav {
    background: #dc2626;
    color: white;
}

.logout-nav:hover {
    background: #991b1b;
}

/* Contact Container */
.contact-box {
    width: 90%;
    max-width: 500px;
    margin: 60px auto;
    padding: 35px;
    background: #ffffff;
    color: #0f172a;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

/* Heading */
.contact-box h1 {
    color: #0f172a;
    font-size: 30px;
    margin-bottom: 10px;
}

.contact-box p {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
    line-height: 1.6;
}

/* Input Fields */
input,
textarea {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #f8fafc;
    color: #0f172a;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
}

input:focus,
textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
    background: #ffffff;
}

textarea {
    height: 140px;
    resize: vertical;
}

/* Submit Button */
button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

/* Footer */
footer {
    text-align: center;
    padding: 20px;
    color: #cbd5e1;
    font-size: 13px;
}

/* Mobile Responsive */
@media (max-width: 600px) {
    nav {
        padding: 12px 5px;
    }

    nav a {
        margin: 4px;
        padding: 8px;
        font-size: 14px;
    }

    .contact-box {
        margin: 35px auto;
        padding: 25px 20px;
    }

    .contact-box h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<!-- Navigation Bar -->
<nav>
    <a href="home page.html">Home</a>
    <a href="product.html">Product</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
    <a href="index.html" class="logout-nav">Log Out</a>
</nav>

<!-- Contact Form -->
<div class="contact-box">

    <h1>Contact Us</h1>

    <p>
        Have a question about our cellphone products?
        Send us a message!
    </p>

    <form action="#" method="post">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            aria-label="Your name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            aria-label="Your email"
            required
        >

        <textarea
            name="message"
            placeholder="Write your message here..."
            aria-label="Your message"
            required
        ></textarea>

        <button type="submit">Send Message</button>

    </form>

</div>

<footer>
    &copy; 2026 Tech Store | All Rights Reserved
</footer>

</body>
</html>
